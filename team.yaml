name: coordinator-with-dev-review-worktrees
instructions:
  file: docs/team.md
roles:
  coordinator:
    title: Coordinator
    file: roles/coordinator.md
  developer:
    title: Developer
    file: roles/developer.md
  reviewer:
    title: Reviewer
    file: roles/reviewer.md
naming:
  local_alias:
    sequence: classic-name
    pattern: "{user}-{classic-name}"
  global_alias:
    sequence: classic-name
    pattern: "{user}-{classic-name}"
  global_name:
    pattern: "{user}-{responsibility}"
agents:
  coordinator:
    role_name: coordinator
    identity_scope: local
    home_template: home/coordinator
    work: repo_root
  developer:
    role_name: developer
    identity_scope: local
    home_template: home/developer
    work: git_worktree
  reviewer:
    role_name: reviewer
    identity_scope: local
    home_template: home/reviewer
    work: git_worktree
